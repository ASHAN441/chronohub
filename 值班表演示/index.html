<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>空课表PRO · 排值班表（界面演示）</title>
<style>

    :root{ color-scheme: light dark; }
    html, body{ margin:0; height:100%; }
    body{
      --win-bg: light-dark(#f3f3f3, #202020);
      --win-surface: light-dark(#ffffff, #2b2b2b);
      --win-surface-2: light-dark(#f9f9f9, #323232);
      --win-surface-3: light-dark(#ebebeb, #3a3a3a);
      --win-text: light-dark(#1b1b1b, #f0f0f0);
      --win-text-muted: light-dark(#5f5f5f, #b0b0b0);
      --win-border: light-dark(#d9d9d9, #3a3a3a);
      --win-accent: light-dark(#0078d4, #4cc2ff);
      --win-accent-fg: light-dark(#ffffff, #0b1b2b);
      --win-accent-soft: color-mix(in srgb, var(--win-accent) 13%, var(--win-surface));
      --win-free: light-dark(#107c10, #6ccb5f);
      --cell-pad: 5px 8px;
      font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--win-text);
      background: var(--win-bg);
      font-size: 13px;
      line-height: 1.45;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }
    *, *::before, *::after{ box-sizing:border-box; }

    .win-titlebar{ display:flex; align-items:stretch; height:36px; flex:none; background:var(--win-surface); border-bottom:1px solid var(--win-border); user-select:none; }
    .win-titlebar-left{ display:flex; align-items:center; gap:9px; padding-left:12px; min-width:0; }
    .win-logo{ width:18px; height:18px; border-radius:4px; background:var(--win-accent); color:var(--win-accent-fg); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; }
    .win-title{ font-size:12px; color:var(--win-text-muted); white-space:nowrap; }
    .win-controls{ margin-left:auto; display:flex; flex:none; }
    .win-controls button{ width:46px; height:36px; border:none; background:transparent; color:var(--win-text); font-family:inherit; font-size:12px; display:flex; align-items:center; justify-content:center; cursor:default; }
    .win-controls button:hover{ background:var(--win-surface-3); }
    .win-controls .win-close:hover{ background:#e81123; color:#fff; }

    .win-toolbar{ display:flex; align-items:center; gap:8px; padding:8px 12px; flex:none; background:var(--win-surface); border-bottom:1px solid var(--win-border); flex-wrap:wrap; }
    .tb-btn{ display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 11px; border:1px solid transparent; border-radius:5px; background:transparent; color:var(--win-text); font-family:inherit; font-size:13px; cursor:pointer; }
    .tb-btn:hover{ background:var(--win-surface-3); }
    .tb-btn.primary{ background:var(--win-accent); color:var(--win-accent-fg); }
    .tb-btn.primary:hover{ background:color-mix(in srgb, var(--win-accent) 88%, #000); }
    .tb-sep{ width:1px; height:20px; background:var(--win-border); margin:0 2px; }
    .tb-field{ display:inline-flex; align-items:center; gap:7px; color:var(--win-text-muted); font-size:12px; }
    .tb-select{ font-family:inherit; font-size:13px; height:30px; padding:0 8px; border-radius:5px; border:1px solid var(--win-border); background:var(--win-surface); color:var(--win-text); }
    .tb-spacer{ flex:1; }
    .tb-info{ font-size:12px; color:var(--win-text-muted); }
    .tb-info strong{ color:var(--win-text); font-weight:600; }

    .win-body{ display:flex; align-items:stretch; flex:1; min-height:0; }
    .win-sidebar{ width:224px; flex:none; border-right:1px solid var(--win-border); background:var(--win-surface); padding:12px 10px; overflow-y:auto; }
    .win-sidebar-title{ font-size:12px; font-weight:600; padding:0 6px; }
    .win-sidebar-sub{ font-size:11px; color:var(--win-text-muted); padding:2px 6px 10px; }
    .win-people-list{ display:flex; flex-direction:column; gap:2px; }
    .person-item{ display:flex; align-items:center; gap:8px; padding:6px; border-radius:5px; cursor:pointer; }
    .person-item:hover{ background:var(--win-surface-3); }
    .person-item.is-off{ opacity:.48; }
    .person-check{ accent-color:var(--win-accent); }
    .person-avatar{ width:24px; height:24px; border-radius:50%; background:var(--win-accent-soft); color:var(--win-accent); display:flex; align-items:center; justify-content:center; font-size:12px; flex:none; }
    .person-info{ display:flex; flex-direction:column; min-width:0; }
    .person-name{ font-size:13px; }
    .person-major{ font-size:11px; color:var(--win-text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    .win-main{ flex:1; min-width:0; padding:12px; display:flex; flex-direction:column; }
    .win-grid-wrap{ flex:1; min-height:0; overflow:auto; border:1px solid var(--win-border); border-radius:6px; background:var(--win-border); }
    .win-grid{ width:100%; border-collapse:separate; border-spacing:1px; min-width:760px; table-layout:fixed; }
    .win-grid th, .win-grid td{ background:var(--win-surface); }
    .win-grid th{ padding:7px; font-size:12px; font-weight:600; color:var(--win-text-muted); text-align:center; }
    .win-grid .group-row td{ padding:3px 10px; font-size:11px; color:var(--win-text-muted); background:var(--win-surface-3); text-align:left; }
    .win-grid .period-cell{ text-align:center; font-size:12px; color:var(--win-text-muted); width:50px; }
    .win-grid .slot{ padding:var(--cell-pad); font-size:12px; vertical-align:middle; text-align:center; min-width:92px; cursor:pointer; }
    .win-grid .slot:hover{ outline:1px solid var(--win-accent); outline-offset:-1px; }
    .win-grid .slot.none{ background:var(--win-surface-2); color:var(--win-text-muted); }
    .win-grid .slot.some{ background:color-mix(in srgb, var(--win-free) var(--mix,40%), var(--win-surface)); }
    .win-grid .slot.full{ background:color-mix(in srgb, var(--win-free) var(--mix,100%), var(--win-surface)); }
    .win-grid .slot .cell-big{ font-size:15px; font-weight:600; line-height:1.25; }
    .win-grid .slot .cell-sub{ font-size:11px; color:var(--win-text-muted); }
    .roster-list{ max-height:320px; overflow-y:auto; border:1px solid var(--win-border); border-radius:6px; }
    .roster-item{ display:flex; align-items:center; gap:8px; padding:6px 10px; border-bottom:1px solid var(--win-border); font-size:13px; }
    .roster-item:last-child{ border-bottom:none; }
    .roster-name{ min-width:70px; }
    .roster-meta{ color:var(--win-text-muted); font-size:12px; }
    .roster-group{ margin-left:auto; color:var(--win-text-muted); font-size:12px; }
    .person-del{ width:20px; height:20px; display:flex; align-items:center; justify-content:center; border:1px solid var(--win-border); background:var(--win-surface-2); color:var(--win-text-muted); cursor:pointer; font-size:13px; padding:0; border-radius:5px; margin-left:auto; }
    .person-del:hover{ color:#e81123; background:color-mix(in srgb, #e81123 12%, var(--win-surface)); border-color:color-mix(in srgb, #e81123 45%, var(--win-border)); }
    .person-open{ cursor:pointer; }
    .person-open:hover{ text-decoration:underline; color:var(--win-accent); }
    .win-modal-card.wider{ width:780px; max-width:94vw; }
    .person-grid-wrap{ overflow:auto; max-height:420px; border:1px solid var(--win-border); border-radius:6px; }
    .person-grid{ width:100%; border-collapse:separate; border-spacing:1px; background:var(--win-border); min-width:680px; }
    .person-grid th, .person-grid td{ background:var(--win-surface); padding:5px 6px; font-size:12px; vertical-align:top; text-align:left; }
    .person-grid th{ color:var(--win-text-muted); font-weight:500; text-align:center; background:var(--win-surface-2); }
    .person-grid .pg-group td{ background:var(--win-surface-2); color:var(--win-text-muted); font-size:11px; padding:3px 8px; }
    .person-grid .pg-period{ text-align:center; color:var(--win-text-muted); width:54px; }
    .person-grid .pc-course + .pc-course{ margin-top:6px; padding-top:6px; border-top:1px dashed var(--win-border); }
    .person-grid .pc-name{ font-weight:500; line-height:1.3; }
    .person-grid .pc-meta{ color:var(--win-text-muted); font-size:11px; line-height:1.4; }
    .win-grid .grid-empty{ height:320px; text-align:center; vertical-align:middle; padding:20px; }
    .win-grid .grid-empty-title{ font-size:15px; font-weight:500; margin-bottom:6px; }
    .win-grid .grid-empty-sub{ color:var(--win-text-muted); margin-bottom:14px; }

    .win-legend{ display:flex; align-items:center; gap:14px; margin-top:9px; font-size:12px; color:var(--win-text-muted); flex-wrap:wrap; flex:none; }
    .win-legend-item{ display:inline-flex; align-items:center; gap:6px; }
    .win-legend-dot{ width:10px; height:10px; border-radius:2px; }
    .win-legend-dot.none{ background:var(--win-surface-2); border:1px solid var(--win-border); }
    .win-legend-dot.some{ background:color-mix(in srgb, var(--win-free) 32%, var(--win-surface)); border:1px solid var(--win-free); }
    .win-legend-dot.full{ background:color-mix(in srgb, var(--win-free) 24%, var(--win-surface)); border:1px solid var(--win-free); }
    .win-legend-note{ margin-left:auto; }

    .win-statusbar{ display:flex; align-items:center; gap:16px; height:26px; padding:0 10px; flex:none; background:var(--win-surface); border-top:1px solid var(--win-border); font-size:11px; color:var(--win-text-muted); }
    .win-statusbar strong{ color:var(--win-text); font-weight:600; }
 .win-toast{ position:absolute; left:50%; bottom:44px; transform:translateX(-50%); padding:8px 14px; border-radius:6px; background:var(--win-surface); border:1px solid var(--win-border); box-shadow:0 4px 14px rgba(0,0,0,.18); font-size:13px; color:var(--win-text); z-index:10; display:flex; align-items:center; gap:10px; }
 .win-toast[hidden]{ display:none; }
 .win-toast button{ font-family:inherit; font-size:12px; padding:3px 9px; border-radius:5px; border:1px solid var(--win-border); background:var(--win-surface-2); color:var(--win-text); cursor:pointer; white-space:nowrap; }
 .win-toast button:hover{ background:var(--win-surface-3); }
 .win-progress{ position:absolute; left:50%; bottom:44px; transform:translateX(-50%); width:420px; max-width:80%; padding:10px 14px; border-radius:6px; background:var(--win-surface); border:1px solid var(--win-border); box-shadow:0 4px 14px rgba(0,0,0,.18); z-index:12; }
 .win-progress-head{ display:flex; justify-content:space-between; font-size:13px; color:var(--win-text); margin-bottom:6px; }
 .win-progress-track{ height:8px; border-radius:4px; background:rgba(127,127,127,.22); overflow:hidden; }
 .win-progress-fill{ height:100%; width:0; background:var(--win-accent); transition:width .2s ease; }
 .win-progress-note{ margin-top:6px; font-size:12px; color:var(--win-text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .win-version{ font-size:11px; color:var(--win-text-muted); background:var(--win-surface-3); padding:1px 7px; border-radius:999px; }
    .win-modal{ position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; }
    .win-modal[hidden]{ display:none; }
    .win-modal-backdrop{ position:absolute; inset:0; background:rgba(0,0,0,.4); }
    .win-modal-card{ position:relative; width:320px; max-width:90vw; background:var(--win-surface); border:1px solid var(--win-border); border-radius:10px; box-shadow:0 12px 32px rgba(0,0,0,.3); overflow:hidden; }
    .win-modal-head{ display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:1px solid var(--win-border); font-weight:500; }
    .win-modal-close{ border:none; background:transparent; color:var(--win-text-muted); cursor:pointer; font-size:14px; padding:2px 7px; border-radius:4px; }
    .win-modal-close:hover{ color:var(--win-text); background:var(--win-surface-3); }
    .win-modal-body{ padding:22px 18px 20px; text-align:center; display:flex; flex-direction:column; gap:6px; align-items:center; }
    .about-logo{ width:52px; height:52px; border-radius:12px; background:var(--win-accent); color:var(--win-accent-fg); display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:600; margin-bottom:6px; }
    .about-name{ font-size:16px; font-weight:600; }
    .about-version{ font-size:13px; color:var(--win-text-muted); }
    .about-dev{ font-size:13px; margin-top:8px; }
    .about-contact{ font-size:12px; color:var(--win-text-muted); }
    .about-copyright{ font-size:12px; color:var(--win-text-muted); margin-top:8px; }
    .win-sidebar-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:0 6px; }
    .win-sidebar-head .tb-btn{ height:24px; padding:0 8px; font-size:12px; }
    .group-header{ font-size:11px; font-weight:600; color:var(--win-text-muted); padding:9px 6px 4px; }
    .win-input{ font-family:inherit; font-size:13px; height:32px; padding:0 10px; border-radius:5px; border:1px solid var(--win-border); background:var(--win-surface); color:var(--win-text); width:100%; }
    .win-field-label{ font-size:12px; color:var(--win-text-muted); }
    .group-modal-body{ padding:14px; display:flex; flex-direction:column; gap:10px; }
    .group-modal-actions{ display:flex; justify-content:flex-end; gap:8px; }
    .win-modal-card.wide{ width:460px; }
    .group-list{ max-height:300px; overflow-y:auto; border:1px solid var(--win-border); border-radius:6px; }
    .group-person{ display:flex; align-items:center; gap:8px; padding:6px 10px; border-bottom:1px solid var(--win-border); font-size:13px; cursor:pointer; }
    .group-person:last-child{ border-bottom:none; }
    .group-person:hover{ background:var(--win-surface-3); }
    .group-person .gp-name{ flex:1; }
    .group-person .gp-group{ color:var(--win-text-muted); font-size:12px; }
    .win-form-row{ display:flex; gap:8px; }
    .win-form-row .win-input{ flex:1; width:auto; }
    .win-sidebar-actions{ display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:0 6px 10px; }
    .win-sidebar-actions .tb-btn{ height:30px; justify-content:center; padding:0 6px; font-size:12px; border:1px solid var(--win-border); border-radius:6px; background:var(--win-surface-2); color:var(--win-text); }
    .win-sidebar-actions .tb-btn:hover{ background:var(--win-surface-3); border-color:color-mix(in srgb, var(--win-text) 22%, var(--win-border)); }
    .win-sidebar-actions .tb-btn:active{ background:color-mix(in srgb, var(--win-accent) 14%, var(--win-surface)); border-color:var(--win-accent); }
    .win-sidebar-actions .tb-btn.danger{ grid-column:1 / -1; color:light-dark(#c42b1c, #ff9aa2); }
    .win-sidebar-actions .tb-btn.danger:hover{ background:color-mix(in srgb, light-dark(#c42b1c, #ff9aa2) 12%, var(--win-surface-2)); border-color:color-mix(in srgb, light-dark(#c42b1c, #ff9aa2) 45%, var(--win-border)); }
    .win-sidebar-hint{ grid-column:1 / -1; text-align:center; font-size:12px; color:var(--win-text-muted); }
    .win-sidebar-search{ display:flex; gap:6px; padding:0 6px 8px; }
    .win-sidebar-search .win-input{ height:28px; font-size:12px; }
    #people-search{ flex:1; min-width:0; }
    #people-sort{ width:74px; flex:none; }
    .group-block{ border-radius:6px; padding-bottom:2px; }
    .group-block.over{ background:var(--win-accent-soft); outline:1px dashed var(--win-accent); }
    .group-block .group-header{ display:flex; align-items:center; justify-content:space-between; gap:4px; cursor:grab; }
    .group-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .group-tools{ display:flex; gap:3px; flex:none; align-items:center; }
    .group-btn{ width:20px; height:20px; display:flex; align-items:center; justify-content:center; border:1px solid var(--win-border); background:var(--win-surface-2); color:var(--win-text-muted); cursor:pointer; border-radius:5px; font-size:11px; line-height:1; padding:0; }
    .group-btn:hover{ color:var(--win-text); background:var(--win-surface-3); border-color:color-mix(in srgb, var(--win-text) 22%, var(--win-border)); }
    .group-check{ accent-color:var(--win-accent); cursor:pointer; flex:none; margin:0; }
    .group-move{ font-size:8px; }
    .group-del{ font-size:13px; }
    .group-del:hover{ color:#e81123; background:color-mix(in srgb, #e81123 12%, var(--win-surface)); border-color:color-mix(in srgb, #e81123 45%, var(--win-border)); }
    .group-header.drop-target{ box-shadow:inset 0 2px 0 0 var(--win-accent); }
    .group-header.dragging{ opacity:.5; }
    .group-block.is-filtered{ background:var(--win-accent-soft); }
    .group-name-edit{ cursor:pointer; }
    .group-name-edit:hover{ text-decoration:underline; color:var(--win-accent); }
    .person-item.out-of-scope{ opacity:.5; }
    .group-empty{ font-size:11px; color:var(--win-text-muted); padding:4px 10px 8px; }
    .person-item.dragging{ opacity:.45; }

    /* ================= 合并后新增：左侧导航栏 ================= */
    .shell{ display:flex; flex:1; min-height:0; }
    .rail{ width:76px; flex:none; background:var(--win-surface); border-right:1px solid var(--win-border); padding:8px 6px; display:flex; flex-direction:column; gap:4px; }
    .rail-item{ display:flex; flex-direction:column; align-items:center; gap:4px; padding:9px 2px 7px; border:none; background:transparent; color:var(--win-text); font-family:inherit; font-size:11px; border-radius:6px; cursor:pointer; position:relative; }
    .rail-item svg{ width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
    .rail-item:hover{ background:var(--win-surface-3); }
    .rail-item.active{ background:var(--win-accent-soft); color:var(--win-accent); font-weight:600; }
    .rail-item.active::before{ content:""; position:absolute; left:-6px; top:50%; transform:translateY(-50%); width:3px; height:20px; border-radius:0 2px 2px 0; background:var(--win-accent); }
    .rail-badge{ position:absolute; top:4px; right:12px; min-width:16px; height:16px; padding:0 4px; border-radius:8px; background:var(--win-accent); color:var(--win-accent-fg); font-size:10px; font-weight:600; line-height:16px; text-align:center; }
    .rail-spacer{ flex:1; }
    .view-wrap{ flex:1; min-width:0; display:flex; flex-direction:column; }
    .view{ flex:1; min-height:0; display:none; flex-direction:column; }
    .view.active{ display:flex; }

    /* ================= 合并后新增：账号管理页 ================= */
    .acct-body{ flex:1; min-height:0; display:flex; }
    .acct-list-wrap{ flex:1; min-width:0; overflow:auto; padding:12px; }
    .acct-card{ display:flex; align-items:center; gap:12px; padding:11px 13px; border:1px solid var(--win-border); border-radius:8px; background:var(--win-surface); margin-bottom:8px; cursor:pointer; }
    .acct-card:hover{ border-color:color-mix(in srgb, var(--win-accent) 45%, var(--win-border)); background:var(--win-surface-2); }
    .acct-card.sel{ border-color:var(--win-accent); background:var(--win-accent-soft); }
    .acct-avatar{ width:36px; height:36px; border-radius:50%; background:var(--win-accent-soft); color:var(--win-accent); display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; flex:none; }
    .acct-main{ flex:1; min-width:0; }
    .acct-name{ font-size:14px; font-weight:600; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .acct-star{ color:var(--win-free); font-size:12px; }
    .acct-sub{ font-size:12px; color:var(--win-text-muted); margin-top:2px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .acct-notes{ font-size:11px; color:var(--win-text-muted); background:var(--win-surface-3); padding:0 6px; border-radius:4px; }
    .acct-acts{ display:flex; gap:6px; flex:none; }
    .chip{ font-size:11px; padding:1px 8px; border-radius:999px; border:1px solid transparent; white-space:nowrap; }
    .chip.ok{ color:var(--win-free); background:color-mix(in srgb, var(--win-free) 13%, var(--win-surface)); border-color:color-mix(in srgb, var(--win-free) 38%, var(--win-border)); }
    .chip.no{ color:var(--win-text-muted); background:var(--win-surface-3); border-color:var(--win-border); }
    .icon-btn{ height:26px; padding:0 9px; font-size:12px; font-family:inherit; border:1px solid var(--win-border); border-radius:5px; background:var(--win-surface-2); color:var(--win-text); cursor:pointer; }
    .icon-btn:hover{ background:var(--win-surface-3); }
    .icon-btn.danger:hover{ color:#c42b1c; border-color:color-mix(in srgb, #c42b1c 45%, var(--win-border)); background:color-mix(in srgb, #c42b1c 10%, var(--win-surface)); }
    .acct-side{ width:272px; flex:none; border-left:1px solid var(--win-border); background:var(--win-surface); padding:14px; overflow:auto; }
    .side-title{ font-size:12px; font-weight:600; margin-bottom:8px; }
    .side-kv{ display:flex; justify-content:space-between; gap:8px; font-size:12px; padding:5px 0; border-bottom:1px dashed var(--win-border); }
    .side-kv span:first-child{ color:var(--win-text-muted); }
    .side-kv span:last-child{ text-align:right; word-break:break-all; }
    .flow-card{ margin-top:14px; border:1px solid var(--win-border); border-radius:8px; padding:11px; background:var(--win-surface-2); }
    .flow-title{ font-size:12px; font-weight:600; margin-bottom:7px; }

<script>
(function(){
  "use strict";

  var DAYS = ['周一','周二','周三','周四','周五','周六','周日'];
  var GROUPS = [{label:'上午',from:1,to:4},{label:'下午',from:5,to:8},{label:'晚上',from:9,to:11}];
  var DUTY_DAYS = 5;          // 周一到周五
  var DUTY_BLOCKS = [[1,2],[3,4],[5,6],[7,8]];
  var MAX_WEEK = 18;

  function range(a,b){ var o=[]; for(var i=a;i<=b;i++) o.push(i); return o; }

  /* ---------- 确定性伪随机（让 demo 每次打开数据一致） ---------- */
  function rng(seed){
    var s = seed >>> 0;
    return function(){
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  /* ---------- 模拟人员 ---------- */
  var MINISTER_NAMES = ['王浩','李婷','张伟','刘洋','陈静','杨帆','赵敏','黄磊','周涛','吴静',
    '徐磊','孙丽','马超','朱琳','胡军','郭敏','何平','高翔','林芳','罗强',
    '郑洁','梁波','谢婷','宋佳','唐磊','许峰','韩雪','冯刚','邓丽','曹阳',
    '彭飞','曾琳','肖楠','田雨','董洁','袁磊','蒋鑫','蔡欣','余婷'];
  var HALL_NAMES = ['苏航'];

  var PEOPLE = [];

  function makePerson(id, name, group, seed){
    var r = rng(seed);
    var count = 8 + Math.floor(r() * 5);      // 8~12 门，密度接近真实数据
    var courses = [];
    for(var i=0;i<count;i++){
      var day = 1 + Math.floor(r() * 5);
      var block = Math.floor(r() * 4);        // 只取 1-8 节，值班时段重叠才有意义
      var weeks = r() < 0.6 ? range(1, MAX_WEEK) : (r() < 0.5 ? range(1, MAX_WEEK).filter(function(w){ return w%2===1; })
                                                             : range(1, MAX_WEEK).filter(function(w){ return w%2===0; }));
      courses.push({ day: day, start: DUTY_BLOCKS[block][0], end: DUTY_BLOCKS[block][1], weeks: weeks });
    }
    return { id:id, name:name, group:group, courses:courses,
             // 历史累计次数：0~6，故意做出差距，才能看出「优先次数少的」
             history: Math.floor((PEOPLE.length) / 6) };
  }

  MINISTER_NAMES.forEach(function(n, i){ PEOPLE.push(makePerson('m'+i, n, '部长', i*977+13)); });
  HALL_NAMES.forEach(function(n, i){ PEOPLE.push(makePerson('h'+i, n, '台务', 500+i*131)); });

  function key(p){ return p.id; }

  function busyIn(person, day, start, end, week){
    return person.courses.some(function(c){
      if(c.day !== day) return false;
      if(!(c.start <= end && c.end >= start)) return false;
      return week === 'all' ? c.weeks.length > 0 : c.weeks.indexOf(week) !== -1;
    });
  }

  /* ---------- 空课表背景网格（保持界面观感一致） ---------- */
  function renderBackground(){
    var html = '';
    GROUPS.forEach(function(g){
      html += '<tr class="group-row"><td colspan="8">' + g.label + '</td></tr>';
      for(var p=g.from;p<=g.to;p++){
        html += '<tr><td class="period-cell">第'+p+'节</td>';
        for(var d=1;d<=7;d++){
          var free = PEOPLE.filter(function(x){ return !busyIn(x, d, p, p, 1); }).length;
          var total = PEOPLE.length;
          var cls = 'slot', inner = '', style = '';
          if(free === 0){ cls += ' none'; inner = '<div class="cell-sub">全员有课</div>'; }
          else {
            cls += (free === total ? ' full' : ' some');
            style = ' style="--mix:' + Math.max(12, Math.round(free/total*72)) + '%"';
            inner = '<div class="cell-big">'+free+'</div><div class="cell-sub">/'+total+'</div>';
          }
          html += '<td class="'+cls+'"'+style+'>'+inner+'</td>';
        }
        html += '</tr>';
      }
    });
    document.getElementById('grid-body').innerHTML = html;

    document.getElementById('people-list').innerHTML = PEOPLE.slice(0, 12).map(function(x){
      return '<div class="person-item">' +
        '<input class="person-check" type="checkbox" checked>' +
        '<span class="person-avatar">'+x.name.slice(0,1)+'</span>' +
        '<span class="person-info"><span class="person-name">'+x.name+'</span>' +
        '<span class="person-major">'+x.group+'</span></span></div>';
    }).join('') + '<div class="win-sidebar-sub" style="padding:6px 6px 0">…还有 28 人</div>';
  }

  /* ---------- 排班 ---------- */
  var state = { group:'部长', week:1, slots:{}, totals:{}, assigned:{}, pool:[] };

  function buildWeekSelect(){
    var sel = document.getElementById('duty-week');
    var html = '';
    for(var w=1; w<=MAX_WEEK; w++) html += '<option value="'+w+'">第 '+w+' 周</option>';
    sel.innerHTML = html;
  }

  function resetTotals(pool){
    state.totals = {};
    pool.forEach(function(p){ state.totals[key(p)] = p.history; });
  }

  function generate(){
    var group = document.getElementById('duty-group').value;
    var week = parseInt(document.getElementById('duty-week').value, 10);
    var pool = PEOPLE.filter(function(p){ return p.group === group; });

    state.group = group;
    state.week = week;
    state.pool = pool;
    state.assigned = {};
    resetTotals(pool);

    var slots = [];
    DUTY_BLOCKS.forEach(function(b, bi){
      for(var day=1; day<=DUTY_DAYS; day++){
        var cands = pool.filter(function(p){ return !busyIn(p, day, b[0], b[1], week); });
        slots.push({ day:day, blockIndex:bi, start:b[0], end:b[1], cands:cands, person:null, open:false });
      }
    });

    // 先排「能选的人最少」的班次：这些最可能排不上，先给它们挑
    slots.slice().sort(function(a,b){ return a.cands.length - b.cands.length; })
      .forEach(function(slot){
        var avail = slot.cands.filter(function(p){ return !state.assigned[key(p)]; });
        if(!avail.length){ slot.open = true; return; }

        // 只在「累计次数最少」的那批人里随机 —— 保留随机性，但保证公平
        var min = Math.min.apply(null, avail.map(function(p){ return state.totals[key(p)]; }));
        var best = avail.filter(function(p){ return state.totals[key(p)] === min; });
        var pick = best[Math.floor(Math.random() * best.length)];

        slot.person = pick;
        state.assigned[key(pick)] = slot;
        state.totals[key(pick)] += 1;
      });

    state.slots = {};
    slots.forEach(function(s){ state.slots[s.day + '-' + s.blockIndex] = s; });

    renderDuty();
  }

  function renderDuty(){
    var head = '<tr><th>节次</th>';
    for(var d=1; d<=DUTY_DAYS; d++) head += '<th>' + DAYS[d-1] + '</th>';
    head += '</tr>';
    document.getElementById('duty-head').innerHTML = head;

    var body = '';
    DUTY_BLOCKS.forEach(function(b, bi){
      body += '<tr><th>第'+b[0]+'-'+b[1]+'节</th>';
      for(var d=1; d<=DUTY_DAYS; d++){
        var slot = state.slots[d + '-' + bi];
        if(!slot){ body += '<td></td>'; continue; }
        if(slot.open){
          body += '<td class="open" data-day="'+d+'" data-block="'+bi+'">无人可排' +
                  '<span class="duty-cell-meta">候选人已用尽</span></td>';
        } else {
          body += '<td data-day="'+d+'" data-block="'+bi+'">' +
                  '<span class="duty-name">'+slot.person.name+'</span>' +
                  '<span class="duty-cell-meta">'+state.totals[key(slot.person)]+' 次</span></td>';
        }
      }
      body += '</tr>';
    });
    document.getElementById('duty-body').innerHTML = body;

    var total = DUTY_DAYS * DUTY_BLOCKS.length;
    var filled = 0, openCount = 0, usedPeople = 0;
    Object.keys(state.slots).forEach(function(k){
      var s = state.slots[k];
      if(s.open) openCount++; else if(s.person) filled++;
    });
    usedPeople = Object.keys(state.assigned).length;

    document.getElementById('duty-summary').innerHTML =
      '<span>班次 <b>'+total+'</b> 个 · 已排 <b>'+filled+'</b> 个</span>' +
      (openCount ? '<span class="warn">无人可排 <b>'+openCount+'</b> 个</span>' : '') +
      '<span>参与 <b>'+usedPeople+'</b> 人 · 本周轮空 <b>'+(state.pool.length-usedPeople)+'</b> 人</span>' +
      '<span>「'+state.group+'」组共 <b>'+state.pool.length+'</b> 人</span>';

    document.getElementById('duty-hint').textContent = '点任意格子可换人';

    renderCounts();
  }

  function renderCounts(){
    var hint = document.getElementById('duty-count-hint');
    hint.textContent = '（数字含历史累计；高亮的是本周值班的人）';

    var list = state.pool.slice().sort(function(a,b){
      return state.totals[key(b)] - state.totals[key(a)] || a.name.localeCompare(b.name);
    });

    document.getElementById('duty-chips').innerHTML = list.map(function(p){
      var on = !!state.assigned[key(p)];
      var cls = 'duty-chip' + (on ? ' on' : '') + (on ? '' : ' muted');
      return '<span class="'+cls+'">'+p.name+'<span class="cnt">'+state.totals[key(p)]+' 次</span></span>';
    }).join('');
  }

  /* ---------- 换人 ---------- */
  function closePicker(){
    var old = document.querySelector('.duty-picker');
    if(old) old.remove();
  }

  function openPicker(td){
    closePicker();
    var day = parseInt(td.getAttribute('data-day'), 10);
    var bi = parseInt(td.getAttribute('data-block'), 10);
    var slot = state.slots[day + '-' + bi];
    if(!slot) return;

    var b = DUTY_BLOCKS[bi];
    var candidates = state.pool.filter(function(p){
      return !state.assigned[key(p)] && !busyIn(p, day, b[0], b[1], state.week);
    }).sort(function(a,c){ return state.totals[key(a)] - state.totals[key(c)]; });

    var box = document.createElement('div');
    box.className = 'duty-picker';

    if(!candidates.length){
      box.innerHTML = '<div class="duty-picker-empty">这个时段没有可替换的人<br>（要么有课，要么本周已值过）</div>';
    } else {
      box.innerHTML = '<div class="duty-picker-title">' + DAYS[day-1] + ' 第'+b[0]+'-'+b[1]+'节 · 可换的人</div>' +
        candidates.map(function(p){
          return '<div class="duty-picker-item" data-pick="'+p.id+'">' +
                 '<span>'+p.name+'</span><span class="c">'+state.totals[key(p)]+' 次</span></div>';
        }).join('');
    }

    var rect = td.getBoundingClientRect();
    box.style.left = Math.min(rect.left, window.innerWidth - 226) + 'px';
    box.style.top = Math.min(rect.bottom + 4, window.innerHeight - 270) + 'px';
    document.body.appendChild(box);

    box.addEventListener('click', function(e){
      var item = e.target.closest ? e.target.closest('[data-pick]') : null;
      if(!item) return;
      var pickId = item.getAttribute('data-pick');
      var person = state.pool.filter(function(x){ return x.id === pickId; })[0];
      if(!person) return;

      if(slot.person){
        state.totals[key(slot.person)] -= 1;
        delete state.assigned[key(slot.person)];
      }
      slot.person = person;
      slot.open = false;
      state.assigned[key(person)] = slot;
      state.totals[key(person)] += 1;

      closePicker();
      renderDuty();
    });
  }

  /* ---------- 事件 ---------- */
  function switchView(name){
    ['freetime','duty'].forEach(function(key){
      var view = document.getElementById('view-' + key);
      if(view) view.classList.toggle('active', key === name);
    });
    var items = document.querySelectorAll('.rail-item[data-view]');
    for(var i=0;i<items.length;i++){
      items[i].classList.toggle('active', items[i].getAttribute('data-view') === name);
    }
    closePicker();
  }

  function bind(){
    document.getElementById('rail-freetime').addEventListener('click', function(){
      switchView('freetime');
    });

    document.getElementById('duty-rail').addEventListener('click', function(){
      switchView('duty');
      if(!Object.keys(state.slots).length) generate();
      else renderDuty();
    });

    document.getElementById('duty-generate').addEventListener('click', generate);
    document.getElementById('duty-again').addEventListener('click', generate);

    document.getElementById('duty-body').addEventListener('click', function(e){
      var td = e.target.closest ? e.target.closest('td[data-day]') : null;
      if(td) openPicker(td);
    });

    document.addEventListener('click', function(e){
      var box = document.querySelector('.duty-picker');
      if(!box) return;
      if(!box.contains(e.target) && !(e.target.closest && e.target.closest('td[data-day]'))) closePicker();
    });

    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape') closePicker();
    });
  }

  buildWeekSelect();
  renderBackground();
  bind();
})();
</script>
</body>
</html>
